minimum_pre_commit_version: 3.2.0 # necessitated by Lucas-C's hooks
default_install_hook_types: [pre-commit, pre-push]
exclude: "thirdParty"
repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v20.1.8
  hooks:
  - id: clang-format
    files: \.(cpp|hpp)
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: no-commit-to-branch
    args: [-b, dev_v3.x]
  - id: check-merge-conflict
  - id: trailing-whitespace
    exclude_types: [markdown, rst]
  - id: end-of-file-fixer
    exclude_types: [svg]
  - id: check-yaml
  - id: mixed-line-ending
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.5
  hooks:
    - id: forbid-tabs
      types_or: [file]
      exclude_types: [rst]
    - id: remove-tabs
      types_or: [file]
      exclude_types: [rst]
    - id: forbid-crlf
    - id: remove-crlf
- repo: https://github.com/BlankSpruce/gersemi
  rev: 0.22.1
  hooks:
    - id: gersemi
      args: [-c, --diff]
    - id: gersemi
      args: [-i]
- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.13.1-1
  hooks:
    - id: shfmt
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
    - id: shellcheck
      # required that shellcheck can follow sourced scripts
      args: [-x]
- repo: local
  hooks:
    - id: ascii-check
      name: ASCII check
      entry: python3 script/git_pre_commit/check_for_non_ascii.py
      language: system
      files: \.(c|cc|cpp|cxx|cu|h|hh|hpp|hxx|cuh)$
- repo: local
  hooks:
    - id: pragma-once
      name: "Check #pragma once"
      entry: script/git_pre_commit/check_pragma_once.sh
      language: system
      files: \.hpp$
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.21
  hooks:
    - id: ruff
      types_or: [ python, pyi, jupyter ]
      # The ignores in here are chosen to conform with the currently
      # existing code and not motivated any other way.
      args: [ --fix]
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]
      args: ["--line-length", "120"]
- repo: local
  hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: python
      types: [python]
      additional_dependencies: [pylint]
      require_serial: true
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
          # for easy usage, pylint is automatically installed in a own environment
          # therefore it cannot check the usage of third party libraries because they need to
          # be in the same python environment
          # setup a CI job to run pylint with third party library check
          "--disable", "import-error"
        ]
      # source: https://github.com/pre-commit/pre-commit/issues/1470#issuecomment-634381955
      # exclude the tests from the linters -> this would be overengineered
      exclude: |
          (?x)(
              ^docs/|
              ^script/job_generator/tests/
          )
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.0'
    hooks:
    - id: mypy
      exclude: |
          (?x)(
              ^docs/|
              ^script/job_generator/tests/
          )
